[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "residential-ip-manager"
version = "0.1.0"
description = "Windows desktop controller for strict residential VPNGate exits through Clash and OpenVPN."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Guli-Joy" }]
keywords = ["vpngate", "openvpn", "clash", "residential-ip", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.28,<1",
  "PySide6>=6.8,<7",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.2,<2",
  "pyright>=1.1.390",
  "ruff>=0.9,<1",
]
build = [
  "pillow>=11,<13",
  "pyinstaller>=6.16,<7",
]

[project.scripts]
residential-ip-manager = "residential_ip_manager.main:main"

[project.urls]
Homepage = "https://github.com/Guli-Joy/residential-ip-manager"
Repository = "https://github.com/Guli-Joy/residential-ip-manager"
Issues = "https://github.com/Guli-Joy/residential-ip-manager/issues"
Releases = "https://github.com/Guli-Joy/residential-ip-manager/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
residential_ip_manager = ["assets/*.svg", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
