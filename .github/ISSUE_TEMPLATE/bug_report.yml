name: Bug report
description: 报告可复现的功能、连接、环境检测或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请删除 Clash 订阅、控制器密钥、OpenVPN 凭据和可识别个人网络的信息。
        安全漏洞请不要使用公开 Issue，改用仓库的 Security Advisory。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: v0.1.3 或 commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: 启动方式
      options:
        - GitHub Release EXE
        - start_app.vbs
        - Python 命令行
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境检测结果
      description: 列出失败项；不要粘贴订阅和密钥。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已使用最新 Release 复现
          required: true
        - label: 我已删除订阅、凭据、密钥和个人网络信息
          required: true
