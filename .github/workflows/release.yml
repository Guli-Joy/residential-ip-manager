name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Quality gate
        shell: pwsh
        run: |
          python -m ruff check src scripts
          python -m pyright
          python -m compileall -q src
          python -m pip check

      - name: Build single-file EXE
        shell: pwsh
        run: .\scripts\build_exe.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath .\dist\ResidentialIPManager.exe
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ResidentialIPManager-${{ github.ref_name }}-windows-x64
          path: |
            dist/ResidentialIPManager.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Residential IP Manager ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ResidentialIPManager.exe
            dist/SHA256SUMS.txt
